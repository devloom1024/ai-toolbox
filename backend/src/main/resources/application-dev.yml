spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}

logging:
  level:
    root: INFO
    com.devloom.ai.toolbox: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.engine.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.jdbc.core: TRACE

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-ttl-seconds: 3600
      issuer: ai-toolbox
  auth:
    verification-code:
      expire-minutes: 10
      request-interval-seconds: 60
    token:
      refresh-token-ttl-days: 30
      default-device: WEB
    linuxdo:
      client-id: ${LINUXDO_CLIENT_ID}
      client-secret: ${LINUXDO_CLIENT_SECRET}
      authorize-url: ${LINUXDO_AUTHORIZE_URL}
      token-url: ${LINUXDO_TOKEN_URL}
      profile-url: ${LINUXDO_PROFILE_URL}
      redirect-base-url: ${LINUXDO_REDIRECT_BASE_URL}
      state-ttl-minutes: ${LINUXDO_STATE_TTL}
      proxy:
        enabled: ${LINUXDO_PROXY_ENABLED}
        host: ${LINUXDO_PROXY_HOST}
        port: ${LINUXDO_PROXY_PORT}
        username: ${LINUXDO_PROXY_USERNAME}
        password: ${LINUXDO_PROXY_PASSWORD}

  # 投资模块配置
  investment:
    market-data:
      # 数据源配置
      data-sources:
        # A股数据源
        a-share:
          - name: akshare
            type: PYTHON_SERVICE
            url: ${AKSHARE_SERVICE_URL:http://localhost:8081}
            priority: 1
            timeout: 5000
            max-retries: 3
            rate-limit: 60
            enabled: true

          - name: tushare
            type: PYTHON_SERVICE
            url: ${TUSHARE_SERVICE_URL:http://localhost:8083}
            api-key: ${TUSHARE_API_KEY:}
            priority: 2
            timeout: 5000
            max-retries: 3
            rate-limit: 60
            enabled: false

        # 美股数据源
        us:
          - name: yfinance
            type: PYTHON_SERVICE
            url: ${YFINANCE_SERVICE_URL:http://localhost:8082}
            priority: 1
            timeout: 5000
            max-retries: 3
            rate-limit: 60
            enabled: true

        # 港股数据源
        hk:
          - name: yfinance
            type: PYTHON_SERVICE
            url: ${YFINANCE_SERVICE_URL:http://localhost:8082}
            priority: 1
            timeout: 5000
            max-retries: 3
            rate-limit: 60
            enabled: true

        # ETF数据源
        etf:
          - name: akshare
            type: PYTHON_SERVICE
            url: ${AKSHARE_SERVICE_URL:http://localhost:8081}
            priority: 1
            timeout: 5000
            max-retries: 3
            rate-limit: 60
            enabled: true

        # 场外基金数据源
        fund:
          - name: akshare
            type: PYTHON_SERVICE
            url: ${AKSHARE_SERVICE_URL:http://localhost:8081}
            priority: 1
            timeout: 5000
            max-retries: 3
            rate-limit: 60
            enabled: true

      # 缓存配置
      cache:
        # L1本地缓存 (Caffeine)
        l1:
          enabled: true
          max-size: 10000
          expire-after-write-seconds: 60
          initial-capacity: 100
          record-stats: true

        # L2分布式缓存 (Redis)
        l2:
          enabled: true
          expire-after-write-seconds: 300
          record-stats: true

      # 熔断器配置
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state-seconds: 30
        sliding-window-size: 100
        sliding-window-type: COUNT_BASED
        permitted-number-of-calls-in-half-open-state: 10
        minimum-number-of-calls: 10
        automatic-transition-from-open-to-half-open-enabled: true

      # 健康检查配置
      health-check:
        enabled: true
        interval-seconds: 60
        timeout-seconds: 5
        success-rate-threshold: 0.5

      # 搜索配置
      search:
        # 搜索结果缓存时间 (秒)
        cache-ttl-seconds: 300
        # 热门股票缓存时间 (秒)
        hot-cache-ttl-seconds: 3600
        # 默认返回数量
        default-limit: 20
        # 最大返回数量
        max-limit: 100