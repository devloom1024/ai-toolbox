spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}

logging:
  level:
    root: INFO
    com.devloom.ai.toolbox: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.engine.transaction: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.jdbc.core: TRACE

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-ttl-seconds: 3600
      issuer: ai-toolbox
  auth:
    verification-code:
      expire-minutes: 10
      request-interval-seconds: 60
    token:
      refresh-token-ttl-days: 30
      default-device: WEB
    linuxdo:
      client-id: ${LINUXDO_CLIENT_ID}
      client-secret: ${LINUXDO_CLIENT_SECRET}
      authorize-url: https://linux.do/oauth/authorize
      token-url: https://linux.do/oauth/token
      profile-url: https://linux.do/api/profile
      redirect-base-url: https://app.local/oauth/linuxdo/callback
      state-ttl-minutes: 5
