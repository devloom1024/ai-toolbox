spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_toolbox}
    username: ${DB_USERNAME:app_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    root: INFO
    com.devloom.ai.toolbox: INFO
    org.springframework.web: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  
  file:
    name: /var/log/ai-toolbox/application.log
    max-size: 100MB
    max-history: 30

app:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      access-token-ttl-seconds: ${ACCESS_TOKEN_TTL:3600}
      issuer: ai-toolbox
  auth:
    verification-code:
      expire-minutes: ${VCODE_EXPIRE_MINUTES:10}
      request-interval-seconds: ${VCODE_INTERVAL_SECONDS:60}
    token:
      refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
      default-device: ${DEFAULT_DEVICE:WEB}
    linuxdo:
      client-id: ${LINUXDO_CLIENT_ID:}
      client-secret: ${LINUXDO_CLIENT_SECRET:}
      authorize-url: ${LINUXDO_AUTHORIZE_URL:https://linux.do/oauth/authorize}
      token-url: ${LINUXDO_TOKEN_URL:https://linux.do/oauth/token}
      profile-url: ${LINUXDO_PROFILE_URL:https://linux.do/api/profile}
      redirect-base-url: ${LINUXDO_REDIRECT_BASE_URL:https://app.example.com/oauth/linuxdo/callback}
      state-ttl-minutes: ${LINUXDO_STATE_TTL:5}
