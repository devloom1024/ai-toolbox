services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_USER=${DB_USERNAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
    ports:
      - '5432:5432'
    volumes:
      - '${DATA_PERSIST_ROOT}/postgres:/var/lib/postgresql/data'
  redis:
    image: 'redis:7-alpine'
    environment:
      - 'REDIS_PASSWORD=${REDIS_PASSWORD}'
      - 'REDIS_USERNAME=${REDIS_USERNAME}'
    ports:
      - '6379:6379'
    volumes:
      - '${DATA_PERSIST_ROOT}/redis:/data'
