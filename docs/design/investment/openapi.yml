      properties:
        dailyDiagnosisEnabled:
          type: boolean
          description: 是否开启每日持仓诊断推送
          example: true
        buildRecommendEnabled:
          type: boolean
          description: 是否开启建仓推荐推送
          example: true
        recommendCount:
          type: integer
          description: 每日推荐数量
          example: 5
        includeWatchlist:
          type: boolean
          description: 是否包含自选股
          example: true
        includeMarket:
          type: boolean
          description: 是否包含市场概览
          example: true
        includeSector:
          type: boolean
          description: 是否包含热门板块
          example: true
        alertConditions:
          type: object
          description: 预警条件配置
          example:
            priceChangePercent: 5
            volumeChangePercent: 200

    PushConfigResponse:
      type: object
      description: 推送配置响应
      properties:
        pushEnabled:
          type: boolean
          description: 是否开启消息总开关
          example: true
        config:
          $ref: '#/components/schemas/PushConfig'
          description: 推送配置详情

