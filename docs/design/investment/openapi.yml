          description: 条件类型
          enum: [INDICATOR, PRICE, VOLUME, FUNDAMENTAL, CUSTOM]
        indicatorName:
          type: string
          description: 指标名称
          example: "MA20"
        operator:
          type: string
          description: 运算符
          enum: [GT, LT, GTE, LTE, EQ, CROSS_UP, CROSS_DOWN]
        thresholdValue:
          type: number
          description: 阈值
        thresholdIndicator:
          type: string
          description: 阈值指标
        thresholdMultiplier:
          type: number
          description: 阈值乘数

