          description: 关联的持仓 ID
          example: 1
        accountId:
          type: integer
          description: 账号 ID
          example: 1
        accountName:
          type: string
          description: 账号名称
          example: "东方财富 A 股"
        tradeType:
          type: string
          description: 交易类型
          enum: [BUY, SELL]
          example: "BUY"
        shares:
          type: number
          description: 成交份额，单位：股
          example: 50
        amount:
          type: number
          description: 成交金额，单位：元
          example: 91000.00
        price:
          type: number
          description: 成交价格/净值
          example: 1820.00
        tradeFee:
          type: number
          description: 交易费用
          example: 25.00
        profit:
          type: number
          description: 本次交易收益（减仓时计算）
          example: 495.10
        notes:
          type: string
          description: 备注
          example: "加仓"
        tradeAt:
          type: string
          description: 交易时间
          format: date-time
          example: "2024-03-20T14:00:00Z"
        createdAt:
          type: string
          description: 记录创建时间
          format: date-time

    # AI 分析
    AnalysisRequest:
      type: object
      description: AI 建仓分析请求
      required:
        - symbol
        - market
      properties:
        symbol:
          type: string
          description: 股票/基金代码
          example: "600519"
        market:
