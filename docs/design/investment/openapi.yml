          description: 推送历史响应
          properties:
            items:
              type: array
              description: 推送历史列表
              items:
                $ref: '#/components/schemas/PushHistoryItem'

    PushHistoryItem:
      type: object
      description: 推送历史项
      properties:
        id:
          type: integer
          description: 推送记录 ID
          example: 1
        pushType:
          type: string
          description: |
            推送类型：
            - DAILY_DIAGNOSIS：每日持仓诊断
            - BUILD_RECOMMEND：建仓推荐
            - ALERT：异动提醒
            - STRATEGY_SIGNAL：策略信号
            - SECTOR_REPORT：热门板块周报
            - MONTHLY_REPORT：AI投资月报
          enum: [DAILY_DIAGNOSIS, BUILD_RECOMMEND, ALERT, STRATEGY_SIGNAL, SECTOR_REPORT, MONTHLY_REPORT]
          example: "DAILY_DIAGNOSIS"
        title:
          type: string
          description: 推送标题
          example: "您的每日投资诊断报告已生成"
        content:
          type: string
          description: 推送内容（HTML 或 Markdown 格式）
          example: "<h2>今日诊断</h2>..."
        symbols:
          type: array
          description: 相关股票代码列表
          items:
            type: string
          example: ["600519", "000001"]
        sentAt:
          type: string
          description: 发送时间
          format: date-time
          example: "2024-03-20T08:00:00Z"
        read:
          type: boolean
          description: 是否已读
          example: false

