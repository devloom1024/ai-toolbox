          type: string
          description: 策略名称
        description:
          type: string
          description: 策略描述
        status:
          type: string
          description: 策略状态
          enum: [DRAFT, BACKTESTING, ENABLED, DISABLED]

    StrategyCondition:
      type: object
      description: 策略条件
      properties:
        id:
          type: integer
          description: 条件 ID
          example: 1
        conditionType:
          type: string
          description: |
            条件类型：
            - INDICATOR：技术指标
            - PRICE：价格条件
            - VOLUME：成交量条件
            - FUNDAMENTAL：基本面条件
            - CUSTOM：自定义
          enum: [INDICATOR, PRICE, VOLUME, FUNDAMENTAL, CUSTOM]
          example: "INDICATOR"
        indicatorName:
          type: string
          description: 指标名称，如 MA20、RSI14、MACD
          example: "MA20"
        operator:
          type: string
          description: |
            运算符：
            - GT：大于
            - LT：小于
            - GTE：大于等于
            - LTE：小于等于
            - EQ：等于
            - CROSS_UP：上穿
            - CROSS_DOWN：下穿
          enum: [GT, LT, GTE, LTE, EQ, CROSS_UP, CROSS_DOWN]
          example: "CROSS_UP"
        thresholdValue:
          type: number
          description: 阈值（固定数值）
          example: 50
        thresholdIndicator:
          type: string
          description: 阈值指标（与另一指标比较时使用）
        thresholdMultiplier:
          type: number
          description: 阈值乘数（如 MA5×1.5）
          example: 1.5
        logicOperator:
          type: string
          description: |
            逻辑运算符：
            - AND：并且
            - OR：或者
          enum: [AND, OR]
          example: "AND"

    StrategyConditionCreateRequest:
      type: object
