openapi: 3.0.3
info:
  title: Investment Service API
  version: 1.0.0
  description: >
    投资模块接口定义，包括标的搜索、自选管理、标的详情查询。
    响应结构遵循 docs/specs/api.md，所有接口返回 {code,message,data} 的 JSON 格式。
    支持市场：A股、港股、美股、ETF、基金。
servers:
  - url: https://api.example.com
    description: Production
  - url: https://staging-api.example.com
    description: Staging
tags:
  - name: Search
    description: 标的搜索接口
  - name: Watchlist
    description: 自选股管理接口
  - name: Security
    description: 标的详情查询接口
paths:
  # ==================== 标的搜索接口 ====================
  /api/v1/investment/search:
    get:
      tags: [Search]
      summary: 搜索标的
      description: 根据关键词搜索 A股、港股、美股、ETF、基金，支持按名称或代码搜索
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词（股票代码或名称）
          example: "茅台"
        - name: market
          in: query
          required: false
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND, ALL]
            default: ALL
          description: |
            市场类型：
            - A_SHARE: A股
            - HK: 港股
            - US: 美股
            - ETF: ETF
            - FUND: 基金
            - ALL: 全部市场
          example: "A_SHARE"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 返回结果数量限制
          example: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: 分页偏移量
          example: 0
      responses:
        "200":
          description: 搜索成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ==================== 自选管理接口 ====================
  /api/v1/investment/watchlist:
    get:
      tags: [Watchlist]
      summary: 获取自选列表
      description: 获取当前用户的自选股列表，支持按分组和市场过滤
      security:
        - BearerAuth: []
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: 分组 ID，不传则返回所有分组
        - name: market
          in: query
          required: false
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND, ALL]
            default: ALL
          description: 过滤市场类型
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: 页码
          example: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页数量
          example: 20
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchlist"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Watchlist]
      summary: 添加自选
      description: 将标的添加到自选列表，默认添加到默认分组
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchlistRequest"
      responses:
        "201":
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchlistItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 标的已在自选列表中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/investment/watchlist/{id}:
    delete:
      tags: [Watchlist]
      summary: 移除自选
      description: 从自选列表中移除指定标的
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 自选记录 ID
      responses:
        "200":
          description: 移除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 自选记录不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

    put:
      tags: [Watchlist]
      summary: 更新自选信息
      description: 更新自选标的的备注或移动到其他分组
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 自选记录 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWatchlistRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchlistItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 自选记录不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/investment/watchlist/check:
    get:
      tags: [Watchlist]
      summary: 检查是否已添加自选
      description: 检查指定标的是否已在自选列表中
      security:
        - BearerAuth: []
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: 标的代码（纯数字或字母）
          example: "600519"
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchlistCheck"

  # ==================== 自选分组接口 ====================
  /api/v1/investment/watchlist/groups:
    get:
      tags: [Watchlist]
      summary: 获取分组列表
      description: 获取当前用户的所有自选分组及每个分组的标的数量
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchlistGroups"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Watchlist]
      summary: 创建分组
      description: 创建一个新的自选分组
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchlistGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/investment/watchlist/groups/{id}:
    put:
      tags: [Watchlist]
      summary: 更新分组
      description: 重命名自选分组
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 分组 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseWatchlistGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 分组不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

    delete:
      tags: [Watchlist]
      summary: 删除分组
      description: 删除自选分组，组内标的将移至默认分组
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: 分组 ID
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 分组不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  # ==================== 标的详情接口 ====================
  /api/v1/investment/security/{symbol}:
    get:
      tags: [Security]
      summary: 获取标的详情
      description: |
        获取标的的详细信息，包括实时行情、基本面数据等。
        不同市场支持的可用数据类型不同，响应中会返回 availableDataTypes 列表。
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: 标的代码（纯数字或字母）
          example: "600519"
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
          example: "A_SHARE"
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSecurityDetail"
        "404":
          description: 标的不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/investment/security/{symbol}/quote:
    get:
      tags: [Security]
      summary: 获取实时行情
      description: 获取标的的实时行情数据
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: 标的代码（纯数字或字母）
          example: "600519"
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseQuote"

  /api/v1/investment/security/{symbol}/kline:
    get:
      tags: [Security]
      summary: 获取 K 线数据
      description: 获取标的的历史 K 线数据
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: 标的代码（纯数字或字母）
          example: "600519"
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [D, W, M, 5, 15, 30, 60]
            default: D
          description: |
            K 线周期：
            - D: 日K
            - W: 周K
            - M: 月K
            - 5: 5分钟
            - 15: 15分钟
            - 30: 30分钟
            - 60: 60分钟
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 开始日期
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: 结束日期
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 500
            maximum: 5000
          description: 返回数据条数限制
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseKLine"

  /api/v1/investment/security/{symbol}/fundamental:
    get:
      tags: [Security]
      summary: 获取基本面数据
      description: 获取标的的基本面数据（市盈率、市净率、股息率等，仅 A_SHARE 支持）
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: 标的代码（纯数字或字母）
          example: "600519"
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [A_SHARE]
          description: 市场类型（仅支持 A_SHARE）
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFundamental"
        "400":
          description: 不支持的市场类型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/investment/security/{symbol}/financial:
    get:
      tags: [Security]
      summary: 获取财务指标
      description: 获取标的的财务指标数据（净利润、营收、ROE等，仅 A_SHARE 支持）
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: 标的代码（纯数字或字母）
          example: "600519"
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [A_SHARE]
          description: 市场类型（仅支持 A_SHARE）
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseFinancial"
        "400":
          description: 不支持的市场类型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /api/v1/investment/security/{symbol}/capital-flow:
    get:
      tags: [Security]
      summary: 获取资金流向
      description: 获取标的的资金流向数据（仅 A_SHARE 支持）
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          description: 标的代码（纯数字或字母）
          example: "600519"
        - name: market
          in: query
          required: true
          schema:
            type: string
            enum: [A_SHARE]
          description: 市场类型（仅支持 A_SHARE）
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseCapitalFlow"
        "400":
          description: 不支持的市场类型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 参数错误或请求非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
    Unauthorized:
      description: 未认证或 Token 已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
  schemas:
    # ==================== 通用响应 ====================
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
        traceId:
          type: string
          nullable: true
          description: 请求链路追踪 ID

    ApiResponseError:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
      example:
        code: 40001
        message: security not found
        data: null

    # ==================== 错误码 ====================
    InvestmentErrorCodes:
      type: object
      description: 投资模块错误码定义
      properties:
        code:
          type: integer
        name:
          type: string
        message:
          type: string
      example:
        - code: 40001
          name: SECURITY_NOT_FOUND
          message: 标的不存在
        - code: 40002
          name: MARKET_NOT_SUPPORTED
          message: 不支持的市场类型
        - code: 40003
          name: WATCHLIST_EXISTS
          message: 标的已在自选列表中
        - code: 40004
          name: WATCHLIST_NOT_FOUND
          message: 自选记录不存在
        - code: 40005
          name: INVALID_SYMBOL_FORMAT
          message: 标的代码格式无效
        - code: 40006
          name: DATA_SOURCE_ERROR
          message: 数据源获取失败

    # ==================== 搜索相关 ====================
    ApiResponseSearchResult:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SearchResultResponse"
    SearchResultResponse:
      type: object
      properties:
        securities:
          type: array
          items:
            $ref: "#/components/schemas/SecuritySearchItem"
          description: 搜索结果列表
        total:
          type: integer
          format: int64
          description: 搜索结果总数
        limit:
          type: integer
          description: 当前限制数量
        offset:
          type: integer
          description: 当前偏移量

    SecuritySearchItem:
      type: object
      description: 搜索结果项
      properties:
        symbol:
          type: string
          description: 标的代码（不带前缀，纯数字或字母）
          example: "600519"
        name:
          type: string
          description: 标的名称
          example: "贵州茅台"
        market:
          type: string
          enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
        type:
          type: string
          enum: [STOCK, ETF, FUND]
          description: 标的类型

    # ==================== 自选相关 ====================
    ApiResponseWatchlist:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WatchlistDataResponse"
    WatchlistDataResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItemResponse"
          description: 自选列表
        total:
          type: integer
          format: int64
          description: 总数量
        page:
          type: integer
          description: 当前页码
        size:
          type: integer
          description: 每页数量

    WatchlistItemResponse:
      type: object
      description: 自选项
      properties:
        id:
          type: integer
          format: int64
          description: 自选记录 ID
        groupId:
          type: integer
          format: int64
          description: 所属分组 ID
        symbol:
          type: string
          description: 标的代码
        name:
          type: string
          description: 标的名称
        market:
          type: string
          enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
        type:
          type: string
          enum: [STOCK, ETF, FUND]
          description: 标的类型
        note:
          type: string
          nullable: true
          description: 备注
        currentPrice:
          type: number
          format: double
          nullable: true
          description: 当前价
        changePercent:
          type: number
          format: double
          nullable: true
          description: 涨跌幅（%）
        addedAt:
          type: string
          format: date-time
          description: 添加时间

    ApiResponseWatchlistItem:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WatchlistItemResponse"

    AddWatchlistRequest:
      type: object
      required: [symbol, market]
      properties:
        symbol:
          type: string
          description: 标的代码（纯数字或字母）
          example: "600519"
        market:
          type: string
          enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
        groupId:
          type: integer
          format: int64
          nullable: true
          description: 分组 ID，不传则添加到默认分组
        note:
          type: string
          maxLength: 200
          nullable: true
          description: 备注（可选）

    UpdateWatchlistRequest:
      type: object
      properties:
        groupId:
          type: integer
          format: int64
          nullable: true
          description: 目标分组 ID，移动标的到其他分组
        note:
          type: string
          maxLength: 200
          nullable: true
          description: 备注

    ApiResponseWatchlistCheck:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WatchlistCheckResponse"

    WatchlistCheckResponse:
      type: object
      properties:
        inWatchlist:
          type: boolean
          description: 是否已在自选列表中
        watchlistId:
          type: integer
          format: int64
          nullable: true
          description: 自选记录 ID（如果存在）
        groupId:
          type: integer
          format: int64
          nullable: true
          description: 所在分组 ID（如果存在）

    # ==================== 分组相关 ====================
    ApiResponseWatchlistGroups:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/WatchlistGroupResponse"
              description: 分组列表

    ApiResponseWatchlistGroup:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/WatchlistGroupResponse"

    WatchlistGroupResponse:
      type: object
      description: 自选分组
      properties:
        id:
          type: integer
          format: int64
          description: 分组 ID
        name:
          type: string
          description: 分组名称
        isDefault:
          type: boolean
          description: 是否为默认分组
        securityCount:
          type: integer
          description: 分组内标的数量
        sortOrder:
          type: integer
          description: 排序权重（数值越小越靠前）
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        updatedAt:
          type: string
          format: date-time
          description: 更新时间

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 分组名称
          example: "我的自选"
        sortOrder:
          type: integer
          default: 0
          description: 排序权重（可选）

    UpdateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
