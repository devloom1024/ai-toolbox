openapi: 3.0.3
info:
  title: AI Toolbox - Investment API
  description: 投资功能模块 API 文档
  version: 1.0.0
  contact:
    name: AI Toolbox Team

servers:
  - url: /api/v1/investment
    description: 投资模块 API

tags:
  - name: 投资总览
    description: 投资总览和用户设置
  - name: 账号管理
    description: 投资账号管理
  - name: 自选管理
    description: 自选股管理
  - name: 持仓管理
    description: 持仓录入、加仓、减仓、交易记录
  - name: AI 分析
    description: AI 建仓/持仓分析
  - name: 板块分析
    description: 板块排行和推荐
  - name: 组合分析
    description: 持仓组合分析
  - name: 定投策略
    description: 定投计划管理
  - name: 策略工作室
    description: 交易策略管理
  - name: 模拟回测
    description: 策略回测
  - name: 消息推送
    description: 推送配置和历史

paths:
  /overview:
    get:
      tags:
        - 投资总览
      summary: 获取投资总览
      description: 返回用户的投资概览数据（多账号汇总）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
    
  /settings:
    get:
      tags:
        - 投资总览
      summary: 获取用户投资设置
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingResponse'
    
    put:
      tags:
        - 投资总览
      summary: 更新用户投资设置
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingUpdateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ============ 账号管理 ============
  
  /account:
    get:
      tags:
        - 账号管理
      summary: 获取投资账号列表
      parameters:
        - name: includeHidden
          in: query
          schema:
            type: boolean
            default: false
          description: 是否包含隐藏账号
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
    
    post:
      tags:
        - 账号管理
      summary: 添加投资账号
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /account/{id}:
    get:
      tags:
        - 账号管理
      summary: 获取账号详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 账号 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
    
    put:
      tags:
        - 账号管理
      summary: 更新账号
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 账号 ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: 成功
    
    delete:
      tags:
        - 账号管理
      summary: 删除账号
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 账号 ID（删除前需先删除关联的持仓）
      responses:
        '200':
          description: 成功

  # ============ 自选管理 ============
  
  /watchlist:
    get:
      tags:
        - 自选管理
      summary: 获取自选股列表
      parameters:
        - name: groupId
          in: query
          schema:
            type: integer
          description: 分组 ID
        - name: market
          in: query
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistResponse'
    
    post:
      tags:
        - 自选管理
      summary: 添加自选股
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistAddRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /watchlist/{id}:
    delete:
      tags:
        - 自选管理
      summary: 移除自选股
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 自选股 ID
      responses:
        '200':
          description: 成功

  /watchlist/group:
    get:
      tags:
        - 自选管理
      summary: 获取自选分组列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistGroup'
    
    post:
      tags:
        - 自选管理
      summary: 创建自选分组
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistGroupCreateRequest'
      responses:
        '200':
          description: 成功

  /watchlist/search:
    get:
      tags:
        - 自选管理
      summary: 搜索股票
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
        - name: market
          in: query
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockSearchResult'

  # ============ 持仓管理 ============
  
  /position:
    get:
      tags:
        - 持仓管理
      summary: 获取持仓列表
      parameters:
        - name: market
          in: query
          schema:
            type: string
            enum: [A_SHARE, HK, US, ETF, FUND]
          description: 市场类型
        - name: positionType
          in: query
          schema:
            type: string
            enum: [STOCK, ETF, FUND]
          description: 持仓类型
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionListResponse'
    
    post:
      tags:
        - 持仓管理
      summary: 添加持仓（首次录入）
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionCreateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /position/{id}:
    get:
      tags:
        - 持仓管理
      summary: 获取持仓详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 持仓 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionDetailResponse'
    
    delete:
      tags:
        - 持仓管理
      summary: 删除持仓
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 持仓 ID
      responses:
        '200':
          description: 成功

  /position/{id}/buy:
    post:
      tags:
        - 持仓管理
      summary: 加仓
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 持仓 ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionTradeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionTradeResponse'

  /position/{id}/sell:
    post:
      tags:
        - 持仓管理
      summary: 减仓/卖出
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 持仓 ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionTradeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionTradeResponse'

  /position/{id}/trades:
    get:
      tags:
        - 持仓管理
      summary: 获取持仓交易记录
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 持仓 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PositionTradeRecord'

  # ============ AI 分析 ============
  
  /analysis/build:
    post:
      tags:
        - AI 分析
      summary: AI 建仓分析
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'

  /analysis/hold:
    post:
      tags:
        - AI 分析
      summary: AI 持仓分析
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldAnalysisRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldAnalysisResponse'

  /analysis/history:
    get:
      tags:
        - AI 分析
      summary: 获取分析历史
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisHistoryResponse'

  # ============ 板块分析 ============
  
  /sector/ranking:
    get:
      tags:
        - 板块分析
      summary: 获取板块排行
      parameters:
        - name: market
          in: query
          schema:
            type: string
            default: A_SHARE
          description: 市场类型
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorRankingResponse'

  /sector/{sectorId}:
    get:
      tags:
        - 板块分析
      summary: 获取板块详情
      parameters:
        - name: sectorId
          in: path
          required: true
          schema:
            type: string
          description: 板块 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorDetailResponse'

  /sector/recommend:
    get:
      tags:
        - 板块分析
      summary: 获取板块内推荐股票
      parameters:
        - name: sectorId
          in: query
          required: true
          schema:
            type: string
          description: 板块 ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
          description: 推荐数量
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockRecommendation'

  # ============ 组合分析 ============
  
  /portfolio:
    get:
      tags:
        - 组合分析
      summary: 获取组合分析
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioAnalysisResponse'

  /portfolio/optimize:
    post:
      tags:
        - 组合分析
      summary: 获取组合优化建议
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioOptimizeResponse'

  # ============ 定投策略 ============
  
  /dca:
    get:
      tags:
        - 定投策略
      summary: 获取定投计划列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DcaPlanResponse'
    
    post:
      tags:
        - 定投策略
      summary: 创建定投计划
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DcaPlanCreateRequest'
      responses:
        '200':
          description: 成功

  /dca/{id}:
    put:
      tags:
        - 定投策略
      summary: 修改定投计划
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 定投计划 ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DcaPlanUpdateRequest'
      responses:
        '200':
          description: 成功
    
    delete:
      tags:
        - 定投策略
      summary: 删除定投计划
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 定投计划 ID
      responses:
        '200':
          description: 成功

  /dca/recommend:
    get:
      tags:
        - 定投策略
      summary: 获取 AI 定投推荐
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DcaRecommendResponse'

  /dca/simulate:
    post:
      tags:
        - 定投策略
      summary: 定投效果模拟
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DcaSimulateRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DcaSimulateResponse'

  # ============ 策略工作室 ============
  
  /strategy:
    get:
      tags:
        - 策略工作室
      summary: 获取策略列表
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, BACKTESTING, ENABLED, DISABLED]
          description: 策略状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StrategyResponse'
    
    post:
      tags:
        - 策略工作室
      summary: 创建策略
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyCreateRequest'
      responses:
        '200':
          description: 成功

  /strategy/{id}:
    get:
      tags:
        - 策略工作室
      summary: 获取策略详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 策略 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyDetailResponse'
    
    put:
      tags:
        - 策略工作室
      summary: 更新策略
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 策略 ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyUpdateRequest'
      responses:
        '200':
          description: 成功
    
    delete:
      tags:
        - 策略工作室
      summary: 删除策略
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 策略 ID
      responses:
        '200':
          description: 成功

  /strategy/{id}/condition:
    get:
      tags:
        - 策略工作室
      summary: 获取策略条件列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 策略 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StrategyCondition'
    
    post:
      tags:
        - 策略工作室
      summary: 添加策略条件
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 策略 ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyConditionCreateRequest'
      responses:
        '200':
          description: 成功

  /strategy/template:
    get:
      tags:
        - 策略工作室
      summary: 获取策略模板列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StrategyTemplate'

  # ============ 模拟回测 ============
  
  /backtest:
    post:
      tags:
        - 模拟回测
      summary: 开始回测
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'

  /backtest/{id}:
    get:
      tags:
        - 模拟回测
      summary: 获取回测结果
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 回测 ID
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResultResponse'

  /backtest/history:
    get:
      tags:
        - 模拟回测
      summary: 获取回测历史
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestHistoryResponse'

  # ============ 消息推送 ============
  
  /push/config:
    get:
      tags:
        - 消息推送
      summary: 获取推送配置
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushConfigResponse'
    
    put:
      tags:
        - 消息推送
      summary: 更新推送配置
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushConfigUpdateRequest'
      responses:
        '200':
          description: 成功

  /push/history:
    get:
      tags:
        - 消息推送
      summary: 获取推送历史
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: read
          in: query
          schema:
            type: boolean
          description: 已读状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushHistoryResponse'

  /push/{id}/read:
    put:
      tags:
        - 消息推送
      summary: 标记推送已读
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 推送记录 ID
      responses:
        '200':
          description: 成功

# ================= Components =================

components:
  schemas:
    # 通用
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: "ok"
        data:
          type: object
    
    PageResponse:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        items:
          type: array

    # 投资总览
    OverviewResponse:
      type: object
      properties:
        totalAssets:
          type: number
          description: 总资产
        totalProfit:
          type: number
          description: 总收益
        profitRate:
          type: number
          description: 收益率
        positionCount:
          type: integer
          description: 持仓数量
        watchlistCount:
          type: integer
          description: 自选数量
        todayChange:
          type: number
          description: 今日涨跌

    UserSettingResponse:
      type: object
      properties:
        riskTolerance:
          type: string
          enum: [CONSERVATIVE, MODERATE, AGGRESSIVE]
        investmentGoal:
          type: string
          enum: [PRESERVATION, GROWTH]
        experienceLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        pushEnabled:
          type: boolean
        pushConfig:
          $ref: '#/components/schemas/PushConfig'

    UserSettingUpdateRequest:
      type: object
      properties:
        riskTolerance:
          type: string
          enum: [CONSERVATIVE, MODERATE, AGGRESSIVE]
        investmentGoal:
          type: string
          enum: [PRESERVATION, GROWTH]
        experienceLevel:
          type: string
          enum: [BEGINNER, INTERMEDIATE, ADVANCED]

    # 自选管理
    AccountResponse:
      type: object
      properties:
        id:
          type: integer
        accountType:
          type: string
