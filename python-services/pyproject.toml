[project]
name = "python-services"
version = "1.0.0"
description = "Python Services Gateway for AI Toolbox"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "DevLoom"}]
maintainers = [{name = "DevLoom"}]
license = {text = "MIT"}

# 依赖
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "python-json-logger>=2.0.7",
    "structlog>=24.1.0",
    # 数据处理
    "pandas>=2.1.0",
    "numpy>=1.26.0",
]

# 可选依赖组
[project.optional-dependencies]
akshare = ["akshare>=1.11.0"]
# qlib 需要从源码安装或使用开发版本
# qlib = ["qlib"]  # 如需使用，取消注释
yfinance = ["yfinance>=0.2.0"]
tushare = ["tushare>=1.3.0"]
# all 不包含 qlib，因为它需要特殊安装
all = [
    "akshare>=1.11.0",
    "yfinance>=0.2.0",
    "tushare>=1.3.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

# 工具配置
[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

# UV 配置
[tool.uv]
package = true
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]
